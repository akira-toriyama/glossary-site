name: Deploy glossary site

# Reusable workflow. Called from each source repo's
# .github/workflows/glossary.yml.
#
# Behavior:
#   - push to main             → build + deploy to caller's Pages
#   - workflow_dispatch        → build + deploy (manual trigger)
#   - pull_request             → build only (validate, no deploy)
#                                成果物は workflow run の artifact から取れる
#
# 各ソースリポは自分の GITHUB_TOKEN コンテキストで動き、
# https://akira-toriyama.github.io/<repo>/ にデプロイされる。

on:
  workflow_call:
    inputs:
      glossary-path:
        description: "Path to docs/glossary.md within the caller repo"
        required: false
        type: string
        default: "docs/glossary.md"
      builder-ref:
        description: "Ref of akira-toriyama/glossary-site to use for tooling"
        required: false
        type: string
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v7
        with:
          path: caller
          # This job only reads the caller's glossary.md and builds; the Pages
          # publish is the separate deploy job via OIDC — drop the token. t-yaxa
          persist-credentials: false

      - name: Checkout glossary-site tooling
        uses: actions/checkout@v7
        with:
          repository: akira-toriyama/glossary-site
          ref: ${{ inputs.builder-ref }}
          path: tooling
          # Tooling is fetched read-only from a public repo and only ever built
          # locally, never pushed — drop the persisted checkout token. t-yaxa
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: tooling/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: tooling
        run: pnpm install --frozen-lockfile

      - name: Build glossary.json
        working-directory: tooling
        # 経由 env: `${{ inputs.glossary-path }}` を run: に直接展開すると caller 由来の
        # 値で shell injection になり得る（zizmor template-injection）。
        env:
          GLOSSARY_PATH: ${{ inputs.glossary-path }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          node packages/builder/bin/glossary-build.mjs \
            --input "../caller/$GLOSSARY_PATH" \
            --output "packages/viewer/public/glossary.json" \
            --repo "$REPO_NAME"

      - name: Build viewer (SPA)
        working-directory: tooling
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm run build:viewer

      - name: Setup Pages (no-op on PR)
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: tooling/packages/viewer/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
