name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Type-check + build (turbo pipeline)
        run: pnpm run build
      - name: Smoke-test builder against wand's glossary
        run: |
          curl -sSL -o /tmp/wand-glossary.md \
            https://raw.githubusercontent.com/akira-toriyama/wand/main/docs/glossary.md
          node packages/builder/src/build.mjs \
            --input /tmp/wand-glossary.md \
            --output /tmp/glossary.json \
            --repo wand
          test -s /tmp/glossary.json
          python3 -c "import json,sys; d=json.load(open('/tmp/glossary.json')); assert d['entries'], 'no entries'; print(f'{len(d[\"entries\"])} entries, {len(d[\"diagrams\"])} diagrams')"
